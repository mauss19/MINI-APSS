<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplicación del Clima Pro con Foto Emblemática</title>
  <link rel="stylesheet" href="css/tiempo2.css">
  
</head>
<body>
  <main>
    <!-- Convertido a <form> para capturar el evento 'submit' (funciona al presionar Enter o dar Clic) -->
    <form id="form-clima">
      <input 
        type="text" 
        id="input-ciudad" 
        placeholder="Busca una ciudad..." 
        autocomplete="off" 
        required
      >
      <button type="submit" id="btn-buscar">Buscar</button>
    </form>

    <section id="resultado">
      <!-- Estilos en línea movidos a clases para no ensuciar el HTML -->
      <p class="mensaje-estado">Ingresa una ciudad para consultar el clima en tiempo real.</p>
    </section>
  </main>
 

 
<script src="js/tiempo2.js"></script>
</body>
</html>
