<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador Circular</title>
  <link rel="stylesheet" href="css/contador.css">
  
</head>
<body>

   <main class="contenedor">
    <div class="circulo-progreso" id="circulo"></div>

    <section class="panel" id="panel">
      <h1 id="valor" aria-live="polite">0</h1>

      <div class="botones" id="contenedor-botones">
        <div class="grupo-restar">
          <span class="signo-menos" id="signo-menos">-</span>
          <button type="button" id="btn-restar" data-action="restar">-1</button>
        </div>
        <button type="button" id="btn-reset" data-action="reset">Reset</button>
        <button type="button" id="btn-sumar" data-action="sumar">+1</button>
      </div>
    </section>
  </main>

 <script src="js/contador.js" defer></script>

</body>
</html>
