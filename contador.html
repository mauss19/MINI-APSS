<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador Circular</title>
  <link rel="stylesheet" href="css/contador.css">
  
</head>
<body>

  <div class="contenedor">
    <div class="circulo-progreso" id="circulo"></div>

    <div class="panel" id="panel">
      <h1 id="valor">0</h1>
      <div class="botones">
        <div class="grupo-restar">
          <span class="signo-menos" id="signo-menos">-</span>
          <button id="btn-restar">-1</button>
        </div>
        <button id="btn-reset">Reset</button>
        <button id="btn-sumar">+1</button>
      </div>
    </div>
  </div>

 <script src="js/contador.js"></script>

</body>
</html>
